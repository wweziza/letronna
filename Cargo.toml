[package]
name = "letronna"
version = "0.1.0-alpha.1"
description = "A small native desktop agent built with GPUI"
license = "MIT"
repository = "https://github.com/wweziza/letronna"
edition = "2024"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
debug = 0
